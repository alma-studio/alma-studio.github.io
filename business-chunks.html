<style>
:root{
  --white:#FFFFFF;
  --offwhite:#FFF4E6;
  --ink:#16324F;
  --ink-soft:#3E5C77;
  --gray-mid:#8B9BAA;
  --gray-faint:#D8CBBB;
  --line:#F0E0CC;
  --accent:#FF7A3D;
  --accent-dark:#E8622A;
  --sun:#FFC53D;
  --ok:#2E7D5B;
  --ok-bg:#E9F5EF;
  --bad:#C1544A;
  --bad-bg:#FBEAE8;
}
*{box-sizing:border-box;}
body{margin:0; font-family:'Source Sans 3', sans-serif; background:var(--offwhite); color:var(--ink);}
h1,h2,h3{font-family:'Fraunces', serif; margin:0; letter-spacing:-0.01em;}

header{background:rgba(255,255,255,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10;}
.nav{max-width:900px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between;}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-family:'Fraunces', serif; font-weight:600; font-size:17px;}
.brand svg{flex-shrink:0;}
.back-link{font-size:14px; font-weight:600; color:var(--ink-soft); text-decoration:none;}
.back-link:hover{color:var(--accent);}
@media(max-width:600px){
  .nav{flex-direction:column; align-items:flex-start; gap:10px; padding:14px 16px;}
  .brand{font-size:15px;}
  .brand svg{width:22px; height:22px;}
  .back-link{font-size:13.5px;}
}

.wrap{max-width:820px;margin:0 auto;padding:40px 20px 60px;}
h1.tool-title{text-align:center; font-size:36px; font-weight:600; color:var(--ink);}
.sub{text-align:center;color:var(--ink-soft);margin:10px 0 28px; font-size:16px;}
@media(max-width:650px){
  .wrap{padding:28px 16px 50px;}
  h1.tool-title{font-size:27px;}
}

.tabs{display:grid;gap:10px;margin-bottom:14px; grid-template-columns:repeat(4,1fr);}
@media(max-width:650px){.tabs{grid-template-columns:1fr 1fr;}}
.tab{padding:12px 10px; border:1px solid var(--line); border-radius:10px; background:var(--white); font-weight:700; cursor:pointer; font-family:'Source Sans 3',sans-serif; font-size:13.5px; color:var(--ink-soft); transition:background 0.15s,color 0.15s,border-color 0.15s;}
.tab:hover{border-color:var(--accent);}
.tab.active{background:var(--ink); color:var(--white); border-color:var(--ink);}

.card{background:var(--white); border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:0 20px 40px -28px rgba(22,50,79,0.18);}
.top{display:flex;justify-content:space-between;color:var(--gray-mid);font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.03em;}
.top b{color:var(--ink); font-family:'Fraunces',serif; font-weight:600; text-transform:none; letter-spacing:0;}

.prompt{min-height:100px;display:grid;place-items:center;text-align:center; margin:18px 0;}
.big{font-size:26px;font-weight:600; font-family:'Fraunces',serif; color:var(--ink); line-height:1.4;}
.chunk-highlight{color:var(--accent-dark); font-weight:700;}
.verb-word{font-size:32px;font-weight:600; font-family:'Fraunces',serif; color:var(--ink);}

input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font-size:16px; font-family:'Source Sans 3',sans-serif; color:var(--ink); background:var(--offwhite);}
input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button.action{border:0;border-radius:9px;padding:12px 20px;font-weight:700;cursor:pointer; font-family:'Source Sans 3',sans-serif; font-size:14.5px; transition:opacity 0.15s;}
button.action:hover{opacity:0.88;}
.primary{background:var(--accent);color:#fff;}
.secondary{background:var(--offwhite);color:var(--ink); border:1px solid var(--line) !important;}
.feedback{display:none;margin-top:16px;padding:14px 16px;border-radius:12px; font-size:15px;}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-bg);color:var(--ok);}
.feedback.bad{background:var(--bad-bg);color:var(--bad);}
.feedback b{font-family:'Fraunces',serif;}
.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 16px;border:1px solid var(--line);background:var(--white);border-radius:10px;cursor:pointer; font-family:'Source Sans 3',sans-serif; font-size:15px; color:var(--ink); transition:border-color 0.15s,background 0.15s;}
.choice:hover{border-color:var(--accent); background:var(--offwhite);}
.hint{color:var(--gray-mid);font-size:14px; text-align:center;}

.practice-block{padding:20px 0;}
.practice-block + .practice-block{border-top:1px solid var(--line); margin-top:6px;}
.practice-label{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent-dark); margin-bottom:10px;}
.practice-block .verb-word{font-size:26px; text-align:center; margin-bottom:6px;}
.practice-block .big{font-size:20px; text-align:center; margin-bottom:6px; font-family:'Fraunces',serif; font-weight:600; color:var(--ink); line-height:1.4;}
.practice-block .hint{margin-bottom:14px;}
.past-badge{
  text-align:center; font-weight:800; font-size:14px; letter-spacing:0.02em;
  color:var(--accent-dark); background:#FFEDE0; border:1.5px solid var(--accent);
  border-radius:999px; padding:8px 18px; display:table; margin:0 auto 10px;
}
.practice-block input{margin-bottom:0;}
.practice-block .buttons{margin-top:14px;}

/* Notice stage */
.notice-list{display:flex; flex-direction:column; gap:14px;}
.notice-row{padding:16px 18px; border:1px solid var(--line); border-radius:12px; background:var(--offwhite);}
.notice-row .sentence{font-size:16px; line-height:1.55;}


/* Test stage progress */
.test-progress{display:flex; gap:6px; justify-content:center; margin-bottom:6px;}
.test-dot{width:10px; height:10px; border-radius:50%; background:var(--line);}
.test-dot.done-ok{background:var(--ok);}
.test-dot.done-bad{background:var(--bad);}
.test-dot.current{background:var(--accent);}
.test-final{text-align:center;}
.test-final .big-score{font-size:48px; font-family:'Fraunces',serif; font-weight:600; color:var(--ink); margin:12px 0;}

footer{text-align:center; padding:32px 20px; color:var(--gray-mid); font-size:13.5px;}
footer a{color:var(--ink-soft); font-weight:600;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="https://almaepifan.ro/" class="brand">
      <svg width="26" height="26" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="22" fill="#FF7A3D"/><path d="M22 26 h56 a9 9 0 0 1 9 9 v26 a9 9 0 0 1 -9 9 h-30 l-14 16 v-16 h-12 a9 9 0 0 1 -9 -9 v-26 a9 9 0 0 1 9 -9 z" fill="#FFF4E6"/><circle cx="36" cy="48" r="5" fill="#FF7A3D"/><circle cx="50" cy="48" r="5" fill="#FFC53D"/><circle cx="64" cy="48" r="5" fill="#16324F"/></svg>
      Alma Epifan | Engleză 1:1
    </a>
    <a href="https://almaepifan.ro/resurse.html" class="back-link">← Înapoi la resurse</a>
  </div>
</header>

<main class="wrap">
  <h1 class="tool-title">Business English Verbs and Prepositions - Part 1</h1>
  <p class="sub">8 combinații verb + prepoziție frecvente în engleza de business.</p>

  <div class="tabs">
    <button class="tab active" data-mode="notice">1. Read</button>
    <button class="tab" data-mode="practice">2. Practice</button>
    <button class="tab" data-mode="gapfill">3. Gap-fill</button>
    <button class="tab" data-mode="test">4. Test</button>
  </div>

  <section class="card">
    <div class="top"><span id="modeLabel">Read</span><span id="scoreWrap">Score: <b id="score">0</b>/<b id="attempts">0</b></span></div>
    <div id="prompt" class="prompt"></div>
    <div id="answer"></div>
    <div id="feedback" class="feedback"></div>
    <div class="buttons" id="buttonsWrap">
      <button id="check" class="action primary">Check</button>
      <button id="reveal" class="action secondary">Reveal</button>
      <button id="next" class="action secondary">Next</button>
    </div>
  </section>
</main>

<footer>
  Un exercițiu gratuit de la <a href="https://almaepifan.ro/">Alma Epifan | Engleză 1:1</a> — engleza de care ai nevoie.
</footer>

<script>
const CHUNKS=[
  {verb:"focus",     prep:"on",   chunk:"focus on",     pastVerb:"focused",
    example:"Let's focus on the numbers that matter most this quarter.",
    gap:"Our team needs to focus ___ customer satisfaction this year.",
    test:"Let's not get distracted — we need to ______ the top priority.",
    presentTense:"The team focuses on quality every sprint."},
  {verb:"participate",prep:"in",  chunk:"participate in", pastVerb:"participated",
    example:"All team members are expected to participate in the weekly stand-up.",
    gap:"Would you like to participate ___ the training session next week?",
    test:"Every new hire is required to ______ the onboarding workshop.",
    presentTense:"She participates in every planning meeting."},
  {verb:"work",      prep:"on",   chunk:"work on",      pastVerb:"worked",
    example:"She's currently working on a new client proposal.",
    gap:"He's been working ___ the budget report all morning.",
    test:"I spent all morning trying to ______ this messy spreadsheet.",
    presentTense:"He works on the marketing strategy."},
  {verb:"deal",      prep:"with", chunk:"deal with",    pastVerb:"dealt",
    example:"Our support team deals with customer complaints every day.",
    gap:"I'll deal ___ this issue right after lunch.",
    test:"Our support team is trained to ______ angry customers calmly.",
    presentTense:"The manager deals with customer complaints."},
  {verb:"rely",      prep:"on",   chunk:"rely on",      pastVerb:"relied",
    example:"You can rely on Sarah to finish the report on time.",
    gap:"We rely ___ our suppliers to deliver on schedule.",
    test:"In an emergency, you can always ______ your closest colleagues.",
    presentTense:"The company relies on local suppliers."},
  {verb:"invest",    prep:"in",   chunk:"invest in",    pastVerb:"invested",
    example:"The company decided to invest in better software tools.",
    gap:"It's worth investing ___ good training for new hires.",
    test:"It's often cheaper long-term to ______ high-quality equipment.",
    presentTense:"The firm invests in new technology."},
  {verb:"comply",    prep:"with", chunk:"comply with",  pastVerb:"complied",
    example:"All employees must comply with the new security policy.",
    gap:"The factory has to comply ___ strict safety regulations.",
    test:"All staff are legally required to ______ health and safety regulations.",
    presentTense:"The factory complies with safety rules."},
  {verb:"contribute",prep:"to",   chunk:"contribute to", pastVerb:"contributed",
    example:"Everyone's ideas contributed to the project's success.",
    gap:"Her feedback really contributed ___ the final decision.",
    test:"Even small donations can ______ a great cause.",
    presentTense:"Everyone contributes to the final report."}
];

let state={mode:"notice", score:0, attempts:0, currentChunk:null, testOrder:[], testIndex:0, testResults:[]};

function norm(s){return s.toLowerCase().replace(/[.,]/g,"").replace(/\s+/g," ").trim()}
function pick(){return CHUNKS[Math.floor(Math.random()*CHUNKS.length)]}
function feedback(ok,msg){let f=document.getElementById("feedback");f.className="feedback show "+(ok?"ok":"bad");f.innerHTML=msg}
function clearFeedback(){let f=document.getElementById("feedback");f.className="feedback";f.innerHTML=""}
function updateScore(){score.textContent=state.score;attempts.textContent=state.attempts}
function shuffle(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}

function render(){
  clearFeedback();
  const p=document.getElementById("prompt"), a=document.getElementById("answer");
  const buttonsWrap=document.getElementById("buttonsWrap"), scoreWrap=document.getElementById("scoreWrap");
  modeLabel.textContent={notice:"Read",practice:"Practice",gapfill:"Gap-fill",test:"Test"}[state.mode];

  if(state.mode==="notice"){
    scoreWrap.style.visibility="hidden";
    buttonsWrap.style.display="none";
    p.innerHTML="";
    a.innerHTML=`<div class="notice-list">${CHUNKS.map(c=>{
      let sentence=c.example.replace(new RegExp("("+c.verb+"\\w*\\s+"+c.prep+")","i"),'<span class="chunk-highlight">$1</span>');
      return `<div class="notice-row"><div class="sentence">${sentence}</div></div>`;
    }).join("")}</div>`;
    return;
  }

  scoreWrap.style.visibility="visible";

  if(state.mode==="practice"){
    buttonsWrap.style.display="none";
    p.innerHTML="";
    a.innerHTML=`
      <div class="practice-block">
        <div class="practice-label">1. Prepositions</div>
        <div id="prepPrompt" class="verb-word"></div>
        <p class="hint">Which preposition goes with this verb?</p>
        <div id="prepChoices"></div>
        <div id="prepFeedback" class="feedback"></div>
      </div>
      <div class="practice-block">
        <div class="practice-label">2. Past simple</div>
        <div id="pastPrompt" class="big"></div>
        <div class="past-badge">→ Rewrite in the PAST SIMPLE</div>
        <p class="hint">Type the chunk, or rewrite the whole sentence.</p>
        <input id="pastInput" placeholder="e.g. focused on — or the full sentence">
        <div class="buttons">
          <button class="action primary" onclick="checkPast()">Check</button>
          <button class="action secondary" onclick="revealPast()">Reveal</button>
          <button class="action secondary" onclick="nextPast()">Next</button>
        </div>
        <div id="pastFeedback" class="feedback"></div>
      </div>`;
    renderPrep();
    renderPast();
    return;
  }

  if(state.mode==="gapfill"){
    buttonsWrap.style.display="flex";
    check.style.display="inline-block"; reveal.style.display="inline-block"; next.style.display="inline-block";
    state.currentChunk=pick();
    let c=state.currentChunk;
    p.innerHTML=`<div class="big">${c.gap}</div>`;
    a.innerHTML=`<input id="answerInput" placeholder="Type the missing preposition">`;
  }

  if(state.mode==="test"){
    if(state.testIndex>=state.testOrder.length){
      buttonsWrap.style.display="none";
      let correctCount=state.testResults.filter(r=>r).length;
      p.innerHTML="";
      a.innerHTML=`<div class="test-final">
        <div class="hint">Test complete!</div>
        <div class="big-score">${correctCount} / ${CHUNKS.length}</div>
        <button class="action primary" onclick="startTest()">Try Again</button>
      </div>`;
      return;
    }
    buttonsWrap.style.display="none";
    let c=state.testOrder[state.testIndex];
    state.currentChunk=c;
    let dots=state.testOrder.map((x,i)=>{
      let cls="test-dot";
      if(i<state.testIndex) cls+=state.testResults[i]?" done-ok":" done-bad";
      else if(i===state.testIndex) cls+=" current";
      return `<span class="${cls}"></span>`;
    }).join("");
    let others=CHUNKS.filter(x=>x.chunk!==c.chunk);
    let distractors=shuffle(others).slice(0,3).map(x=>x.chunk);
    let opts=shuffle([c.chunk, ...distractors]);
    p.innerHTML=`<div class="test-progress">${dots}</div><div class="big">${c.test}</div><p class="hint">Choose the correct chunk.</p>`;
    a.innerHTML=opts.map(o=>`<button class="choice">${o}</button>`).join("");
    document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      let ok=b.textContent===c.chunk;
      state.testResults[state.testIndex]=ok;
      if(ok) feedback(true,`Correct! <b>${c.chunk}</b>`);
      else feedback(false,`Correct answer: <b>${c.chunk}</b>`);
      state.testIndex++;
      setTimeout(()=>{ render(); }, 900);
    });
  }

  let inp=document.getElementById("answerInput");
  if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==="Enter")checkAnswer()}}
}

function startTest(){
  state.testOrder=shuffle(CHUNKS);
  state.testIndex=0;
  state.testResults=[];
  render();
}

function checkAnswer(){
  let inp=document.getElementById("answerInput");
  if(!inp)return;
  let c=state.currentChunk;

  if(state.mode==="gapfill"){
    state.attempts++;
    if(norm(inp.value)===norm(c.prep)){
      state.score++;
      feedback(true,`Correct! <b>${c.chunk}</b>`);
    } else {
      feedback(false,`Correct answer: <b>${c.prep}</b> (${c.chunk})`);
    }
    updateScore();
  }
}

function revealAnswer(){
  if(state.mode==="gapfill"){
    feedback(true,`<b>${state.currentChunk.prep}</b> (${state.currentChunk.chunk})`);
  }
}

function prepFeedback(ok,msg){let f=document.getElementById("prepFeedback");f.className="feedback show "+(ok?"ok":"bad");f.innerHTML=msg}
function pastFeedback(ok,msg){let f=document.getElementById("pastFeedback");f.className="feedback show "+(ok?"ok":"bad");f.innerHTML=msg}

function renderPrep(){
  let f=document.getElementById("prepFeedback"); if(f){f.className="feedback"; f.innerHTML="";}
  state.prepChunk=pick();
  let c=state.prepChunk;
  let otherPreps=[...new Set(CHUNKS.map(x=>x.prep))].filter(x=>x!==c.prep);
  let distractors=shuffle(otherPreps).slice(0,2);
  let opts=shuffle([c.prep, ...distractors]);
  document.getElementById("prepPrompt").textContent=c.verb+" ___";
  document.getElementById("prepChoices").innerHTML=opts.map(o=>`<button class="choice">${o}</button>`).join("");
  document.querySelectorAll("#prepChoices .choice").forEach(b=>b.onclick=()=>{
    state.attempts++;
    if(b.textContent===c.prep){state.score++;prepFeedback(true,`Correct! <b>${c.chunk}</b>`)}
    else prepFeedback(false,`Correct answer: <b>${c.chunk}</b>`);
    updateScore();
    setTimeout(renderPrep, 900);
  });
}

function renderPast(){
  let f=document.getElementById("pastFeedback"); if(f){f.className="feedback"; f.innerHTML="";}
  state.pastChunk=pick();
  let c=state.pastChunk;
  document.getElementById("pastPrompt").textContent=c.presentTense;
  let inp=document.getElementById("pastInput");
  if(inp){inp.value=""; inp.focus(); inp.onkeydown=e=>{if(e.key==="Enter")checkPast()};}
}
function containsChunk(answerNorm, chunkNorm){
  let answerWords=answerNorm.split(" ");
  let chunkWords=chunkNorm.split(" ");
  for(let i=0;i<=answerWords.length-chunkWords.length;i++){
    if(chunkWords.every((w,j)=>answerWords[i+j]===w)) return true;
  }
  return false;
}
function checkPast(){
  let inp=document.getElementById("pastInput"); if(!inp)return;
  let c=state.pastChunk;
  let pastChunk=c.pastVerb+" "+c.prep;
  state.attempts++;
  let userAnswer=norm(inp.value);
  let ok = userAnswer===norm(pastChunk) || containsChunk(userAnswer, norm(pastChunk));
  if(ok){
    state.score++;
    pastFeedback(true,`Correct! <b>${pastChunk}</b>`);
  } else {
    pastFeedback(false,`Correct answer: <b>${pastChunk}</b>`);
  }
  updateScore();
}
function revealPast(){
  let c=state.pastChunk;
  pastFeedback(true,`<b>${c.pastVerb} ${c.prep}</b>`);
}
function nextPast(){ renderPast(); }

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));

  t.classList.add("active");
  state.mode=t.dataset.mode;
  if(state.mode==="test"){ startTest(); } else { render(); }
});
check.onclick=checkAnswer;
reveal.onclick=revealAnswer;
next.onclick=render;
render();
</script>
